services:
  app:
    build: .
    ports: ["8787:8787"]
    # Opcional: SESSION_SECRET desde el entorno del anfitrión; si no se define, el contenedor genera uno aleatorio.
    environment: { SESSION_SECRET: "${SESSION_SECRET:-}" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 30
  smoke:
    build: .
    command: ["npm", "run", "smoke"]
    environment: { SMOKE_URL: "http://app:8787" }
    depends_on:
      app: { condition: service_healthy }
