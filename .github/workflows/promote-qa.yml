# Promoción automática qa → development.
# Se ejecuta cuando el despliegue de `qa` termina con éxito (npm run check + prueba de humo contra el
# entorno QA). Si `qa` tiene commits que `development` no tiene, abre (o reutiliza) el PR qa → development
# y lo une. Luego dispara timeline-qa para actualizar el avance del equipo.
# `main` (producción) sigue siendo manual: este workflow deja abierto el PR development → main
# ("candidato a release"), que espera la aprobación de Anthony. GitHub le notifica para decidir.
name: promote-qa
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [qa]
concurrency: promote-qa
jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: ¿Hay algo nuevo y probado en qa?
        id: diff
        run: |
          git fetch origin qa development
          QA_SHA=$(git rev-parse origin/qa)
          AHEAD=$(git rev-list --count origin/development..origin/qa)
          echo "qa=$QA_SHA probado=$TESTED_SHA adelantados=$AHEAD"
          if [ "$AHEAD" = "0" ]; then echo "skip=sin-cambios" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Solo se promueve exactamente lo que se probó; si qa avanzó, el siguiente despliegue lo hará.
          if [ "$QA_SHA" != "$TESTED_SHA" ]; then echo "skip=qa-avanzo" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "skip=" >> "$GITHUB_OUTPUT"
      - name: Abrir y unir PR qa → development
        if: steps.diff.outputs.skip == ''
        run: |
          N=$(gh pr list --base development --head qa --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then
            LIST=$(git log --format='- %s' origin/development..origin/qa | head -30)
            gh pr create --base development --head qa \
              --title "QA automático aprobado: promoción a development" \
              --body "Promoción automática tras despliegue y prueba de humo exitosos en QA (commit ${TESTED_SHA:0:7}).

          $LIST"
            N=$(gh pr list --base development --head qa --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$N" --merge
      - name: Actualizar timeline-qa
        if: steps.diff.outputs.skip == ''
        run: gh workflow run timeline-qa.yml --ref development
      - name: Dejar listo el candidato a release (development → main), esperando aprobación
        if: steps.diff.outputs.skip == ''
        run: |
          git fetch origin main development
          if [ "$(git rev-list --count origin/main..origin/development)" = "0" ]; then exit 0; fi
          R=$(gh pr list --base main --head development --state open --json number --jq '.[0].number')
          LIST=$(git log --no-merges --format='- %s' origin/main..origin/development | head -40)
          BODY="## Candidato a release · ¿todo bien para pasar a producción?

          Todo lo de abajo ya pasó QA (tests, reglas, build y prueba de humo) y está estable en **development**.

          **Antes de aprobar:** prueba en https://c-i-qa.equipo-ci.workers.dev y corre el agente QA con IA (PLAN_PRS.md §4.2).
          **Para publicar:** aprueba y une este PR. Producción se despliega sola.

          $LIST"
          if [ -z "$R" ]; then
            gh pr create --base main --head development --title "Release candidato: development → main (requiere aprobación)" --body "$BODY" --assignee AnthonyLeguis --reviewer AnthonyLeguis || gh pr create --base main --head development --title "Release candidato: development → main (requiere aprobación)" --body "$BODY"
          else
            gh pr edit "$R" --body "$BODY"
          fi
